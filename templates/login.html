<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GALERT – Real-time Galamsey Activity Monitor Sign In">
    <title>Sign In – GALERT Monitor</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-page: #191410;
            --card-bg: #ffffff;
            --text-primary: #121826;
            --text-secondary: #6c727f;
            --text-muted: #9da4b0;
            --orange-primary: #e65100;
            --orange-hover: #cf4700;
            --orange-light: #fff5ed;
            --input-border: #e2e4e9;
            --input-focus: #e65100;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --error-text: #dc2626;
            --radius-outer: 28px;
            --radius-inner: 22px;
            --radius-input: 12px;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(230, 81, 0, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(230, 81, 0, 0.06) 0%, transparent 45%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        .auth-container {
            width: 100%;
            max-width: 960px;
            background: var(--card-bg);
            border-radius: var(--radius-outer);
            box-shadow: 
                0 25px 60px -15px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            display: grid;
            grid-template-columns: 1fr 1.08fr;
            padding: 16px;
            gap: 16px;
            overflow: hidden;
            position: relative;
        }

        /* Left Hero Panel */
        .hero-panel {
            position: relative;
            background-color: #0b0d10;
            background-image: url("{{ url_for('static', filename='login_bg.jpg') }}");
            background-size: cover;
            background-position: center bottom;
            border-radius: var(--radius-inner);
            padding: 44px 36px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 520px;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .hero-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg, 
                rgba(11, 13, 16, 0.82) 0%, 
                rgba(11, 13, 16, 0.3) 45%, 
                rgba(11, 13, 16, 0.1) 100%
            );
            pointer-events: none;
        }

        .hero-top {
            position: relative;
            z-index: 2;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ffaa55;
            margin-bottom: 24px;
        }

        .hero-badge .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #ff7700;
            box-shadow: 0 0 10px #ff7700;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .hero-headline {
            font-size: 2.15rem;
            line-height: 1.22;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.025em;
            max-width: 320px;
        }

        .hero-bottom {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        .hero-tag {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.65);
            letter-spacing: 0.02em;
        }

        .hero-tag strong {
            color: #ffffff;
            font-weight: 600;
        }

        /* Right Form Panel */
        .form-panel {
            padding: 36px 36px 36px 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand-header {
            margin-bottom: 32px;
        }

        /* Starburst / Sunburst Icon matching mockup */
        .starburst-icon {
            width: 36px;
            height: 36px;
            color: var(--orange-primary);
            margin-bottom: 22px;
            display: inline-block;
        }

        .form-title {
            font-size: 1.95rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .form-subtitle {
            font-size: 0.93rem;
            color: var(--text-secondary);
            line-height: 1.45;
        }

        /* Error Notification */
        .alert-error {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: var(--radius-input);
            color: var(--error-text);
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 20px;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form Fields */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: #344054;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            height: 50px;
            padding: 0 16px;
            font-family: inherit;
            font-size: 14.5px;
            color: var(--text-primary);
            background: #ffffff;
            border: 1.5px solid var(--input-border);
            border-radius: var(--radius-input);
            outline: none;
            transition: all 0.15s ease-in-out;
        }

        .form-input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3.5px rgba(230, 81, 0, 0.12);
        }

        .form-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .pwd-toggle-btn {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.15s;
        }

        .pwd-toggle-btn:hover {
            color: var(--text-primary);
        }

        /* Sign In Button */
        .btn-submit {
            width: 100%;
            height: 50px;
            margin-top: 10px;
            background: var(--orange-primary);
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-input);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 14px rgba(230, 81, 0, 0.32);
        }

        .btn-submit:hover {
            background: var(--orange-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(230, 81, 0, 0.42);
        }

        .btn-submit:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(230, 81, 0, 0.3);
        }


        /* Responsive */
        @media (max-width: 768px) {
            .auth-container {
                grid-template-columns: 1fr;
                padding: 12px;
                border-radius: 20px;
            }

            .hero-panel {
                min-height: 220px;
                padding: 28px 24px;
            }

            .hero-headline {
                font-size: 1.6rem;
                max-width: 100%;
            }

            .form-panel {
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">

        <!-- Left Hero Panel with Visual & Catchphrase -->
        <div class="hero-panel">
            <div class="hero-top">
                <div class="hero-badge">
                    <span class="pulse-dot"></span>
                    GALERT TELEMETRY
                </div>
                <h2 class="hero-headline">
                    Protect our land from illegal mining activity.
                </h2>
            </div>

            <div class="hero-bottom">
                <span class="hero-tag">GALERT-01 <strong>Connected</strong></span>
                <span class="hero-tag">Kumasi &middot; Obuasi &middot; Manso</span>
            </div>
        </div>

        <!-- Right Sign In Form Panel -->
        <div class="form-panel">

            <div class="brand-header">
                <!-- Sunburst Icon (inspired by reference mockup) -->
                <svg class="starburst-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <line x1="12" y1="2" x2="12" y2="6"></line>
                    <line x1="12" y1="18" x2="12" y2="22"></line>
                    <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                    <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                    <line x1="2" y1="12" x2="6" y2="12"></line>
                    <line x1="18" y1="12" x2="22" y2="12"></line>
                    <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                    <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
                </svg>

                <h1 class="form-title">Sign In</h1>
                <p class="form-subtitle">Welcome back — enter your credentials to access the sensor monitor</p>
            </div>

            <!-- Error message if auth failed -->
            {% if error %}
            <div class="alert-error" role="alert">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Form -->
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label class="form-label" for="email">Your email</label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="admin@galert.com" 
                            value="{{ email or '' }}"
                            required 
                            autocomplete="username"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="••••••••••••" 
                            required 
                            autocomplete="current-password"
                        >
                        <button type="button" class="pwd-toggle-btn" id="togglePasswordBtn" title="Toggle password visibility">
                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    Sign in
                </button>
            </form>

        </div>

    </div>

    <script>
        const pwdInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePasswordBtn');

        toggleBtn.addEventListener('click', () => {
            const isPassword = pwdInput.type === 'password';
            pwdInput.type = isPassword ? 'text' : 'password';
            toggleBtn.style.color = isPassword ? 'var(--orange-primary)' : 'var(--text-secondary)';
        });
    </script>
</body>
</html>
